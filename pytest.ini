[pytest]
# -s  : do not capture stdout (show print / logging output live)
# -v  : verbose — show each test ID + PASSED/FAILED/XFAIL
# --tb=short : compact tracebacks
addopts = -s -v --tb=short
testpaths = tests
python_files = *Tests.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)-7s] %(name)s: %(message)s
log_date_format = %H:%M:%S
